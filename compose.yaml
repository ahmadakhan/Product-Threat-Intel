services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: vulnstream
      POSTGRES_USER: vulnstream_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong migration database password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set a strong runtime database password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=128MB
      -c max_connections=80
      -c effective_cache_size=768MB
      -c max_wal_size=4GB
      -c min_wal_size=256MB
      -c checkpoint_timeout=15min
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/01-runtime-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U vulnstream_migrator -d vulnstream]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks: [backend]
  migrate:
    build: .
    command: [node, server-dist/migrate.js]
    # One-shot job, not a service: it runs to completion and must not be
    # restarted by Docker. The application refuses to start on a schema
    # mismatch, and install/upgrade always runs this job before the app.
    restart: 'no'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vulnstream_migrator:${POSTGRES_PASSWORD:?Set migration password}@db:5432/vulnstream
      GRANT_RUNTIME_ROLE: 'true'
    networks: [backend]
  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Keep the V8 heap below the container limit (2G) while leaving room for
      # the base image, native buffers, and Chromium. --expose-gc enables the
      # 90% memory-pressure GC hint in server/main.ts.
      NODE_OPTIONS: --expose-gc --max-old-space-size=1536
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://vulnstream_app:${APP_DB_PASSWORD:?Set runtime password}@db:5432/vulnstream
      APP_ORIGIN: https://${APP_HOST:?Set public hostname}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a base64 32-byte encryption key}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
      ML_SIGNING_KEY: ${ML_SIGNING_KEY:-}
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS-raw.githubusercontent.com,services.nvd.nist.gov,api.osv.dev,services.nvd.nist.gov,www.googleapis.com,www.cisa.gov,cisa.gov,api.first.org,api.github.com,api.vulncheck.com,otx.alienvault.com,send.api.mailtrap.io,sandbox.api.mailtrap.io,mailtrap.io,api.sendgrid.com,smtp.sendgrid.net,api.postmarkapp.com,smtp.maileroo.com,smtp.lettr.com,api.mailgun.net,api.eu.mailgun.net,in-v3.mailjet.com,api.mailjet.com,smtp.gmail.com,www.bleepingcomputer.com,isc.sans.edu,api.msrc.microsoft.com,www.fortiguard.com,filestore.fortinet.com,www.kb.cert.org,kb.cert.org,thehackernews.com,feeds.feedburner.com,www.securityweek.com,www.rapid7.com,googleprojectzero.blogspot.com,projectzero.google,krebsonsecurity.com,tools.cisco.com,sec.cloudapps.cisco.com,security.paloaltonetworks.com,labs.watchtowr.com,www.talosintelligence.com,blog.talosintelligence.com,www.thezdi.com,www.exploit-db.com,www.debian.org,www.cisecurity.com,cisecurity.com,cisecurity.org,www.cisecurity.org,seclists.org,blog.sucuri.net,www.welivesecurity.com,wordpress.org,www.darkreading.com,blog.google,cloud.google.com,docs.cloud.google.com,workspace.google.com,www.greynoise.io,www.malwarebytes.com,cloudblog.withgoogle.com,www.sophos.com,therecord.media,blog.twitter.com,blog.x.com,github.com,github.blog,www.pentestpartners.com,www.forbes.com,www.theregister.com,api.theregister.com,news.google.com,www.cve.org,cve.org,support.apple.com,helpx.adobe.com,access.redhat.com,security.access.redhat.com,security.redhat.com,usn.ubuntu.com,ubuntu.com,www.crowdstrike.com,crowdstrike.com,securelist.com,www.securelist.com,psirtapi.global.sonicwall.com,psirt.global.sonicwall.com}
      # Redirect targets of the feeds above (for example www.cisecurity.com ->
      # cisecurity.org -> www.cisecurity.org). Each hop is re-validated against
      # the allowlist, so a target missing here fails the feed.
      EGRESS_ALLOWED_HOSTS_EXTRA: ${EGRESS_ALLOWED_HOSTS_EXTRA-}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # PostgreSQL pool size and the slots held back from feed ingestion. Feed
      # concurrency is capped at POOL_MAX_CONNECTIONS - POOL_RESERVED_CONNECTIONS,
      # so a deployment that raises FEED_CONCURRENCY without raising the pool
      # silently keeps the old bound. Both are forwarded here because server
      # config validates them at startup; leaving them out made the knobs
      # unsettable in the supported deployment.
      POOL_MAX_CONNECTIONS: ${POOL_MAX_CONNECTIONS:-25}
      POOL_RESERVED_CONNECTIONS: ${POOL_RESERVED_CONNECTIONS:-4}
      FEED_MAX_DURATION_SECONDS: ${FEED_MAX_DURATION_SECONDS:-1800}
      FEED_RETRY_MAX_ATTEMPTS: ${FEED_RETRY_MAX_ATTEMPTS:-3}
      FEED_RETRY_VULNCHECK_MAX_ATTEMPTS: ${FEED_RETRY_VULNCHECK_MAX_ATTEMPTS:-5}
      FEED_RETRY_BASE_DELAY_MS: ${FEED_RETRY_BASE_DELAY_MS:-2000}
      FEED_RETRY_MAX_DELAY_MS: ${FEED_RETRY_MAX_DELAY_MS:-30000}
      FEED_RETRY_JITTER_FACTOR: ${FEED_RETRY_JITTER_FACTOR:-0.2}
      # How many feeds are polled concurrently. Feeds are I/O-bound and each
      # keeps its own provider pacing, so this bounds network fan-out, not CPU.
      # The run's floor is the slowest single feed; a wider pool only helps when
      # total feed work exceeds that feed's latency.
      FEED_CONCURRENCY: ${FEED_CONCURRENCY:-10}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # A guarded job is aborted only after this long without a progress
      # heartbeat, not after this long in total. A single silent phase (one
      # slow source request or a wedged statement) must fit below it; raise this
      # value if operators observe aborts while a run is still making progress.
      STUCK_PROMISE_MS: ${STUCK_PROMISE_MS:-300000}
      # API instance: serves the SPA and /api endpoints only. No background
      # work runs here; the `worker` service handles pipeline, feeds, delivery,
      # retention, ML training and all other periodic jobs.
      WORKER_ENABLED: ${WORKER_ENABLED:-false}
      # Make /live answer 503 when the event loop has been blocked for more
      # than 10 seconds. The Compose healthcheck below marks the container
      # unhealthy; the host heal timer restarts it.
      HANG_DETECTION_ENABLED: 'true'
      CORRELATION_DLQ_DIRECTORY: /var/lib/vulnstream/deadletters
      # Dead letters live in PostgreSQL. The legacy directory below is only read
      # once at startup to import files left by an earlier file-based deploy; it
      # grows no further and can be removed once the import has run.
      CORRELATION_DLQ_STORAGE_MODE: database
      ML_DIRECTORY: /var/lib/vulnstream/ml
      ML_STORAGE_MODE: database
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Legacy-only: dead letters are stored in PostgreSQL (see
      # CORRELATION_DLQ_STORAGE_MODE). This volume exists solely so an upgrade
      # can import and prune files left by a file-based deployment.
      - correlation-deadletters:/var/lib/vulnstream/deadletters
      - ml-models:/var/lib/vulnstream/ml
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits:
          # API instances are stateless and I/O-bound. 1 CPU / 1 GiB is
          # sufficient; scale replicas horizontally to handle more API traffic.
          cpus: '1'
          memory: 1G
    command: ["node", "server-dist/main-api.js"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
    healthcheck:
      # /live is the process liveness probe, not readiness. A database outage
      # must not trigger a restart loop; an event-loop stall must.
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    networks: [backend, egress]
  worker:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Worker instance: runs all background work (pipeline, feeds, outbox
      # delivery, retention, ML training, digest, self-healing). Exactly one
      # replica is active at a time via PostgreSQL advisory-lock leader
      # election; extra replicas are hot standbys.
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      # Keep the V8 heap below the container limit while leaving room for the
      # base image and native buffers. --expose-gc enables the 90%
      # memory-pressure GC hint.
      NODE_OPTIONS: --expose-gc --max-old-space-size=1536
      NODE_ENV: production
      DATABASE_URL: postgresql://vulnstream_app:${APP_DB_PASSWORD:?Set runtime password}@db:5432/vulnstream
      APP_ORIGIN: https://${APP_HOST:?Set public hostname}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a base64 32-byte encryption key}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
      ML_SIGNING_KEY: ${ML_SIGNING_KEY:-}
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS-raw.githubusercontent.com,services.nvd.nist.gov,api.osv.dev,services.nvd.nist.gov,www.googleapis.com,www.cisa.gov,cisa.gov,api.first.org,api.github.com,api.vulncheck.com,otx.alienvault.com,send.api.mailtrap.io,sandbox.api.mailtrap.io,mailtrap.io,api.sendgrid.com,smtp.sendgrid.net,api.postmarkapp.com,smtp.maileroo.com,smtp.lettr.com,api.mailgun.net,api.eu.mailgun.net,in-v3.mailjet.com,api.mailjet.com,smtp.gmail.com,www.bleepingcomputer.com,isc.sans.edu,api.msrc.microsoft.com,www.fortiguard.com,filestore.fortinet.com,www.kb.cert.org,kb.cert.org,thehackernews.com,feeds.feedburner.com,www.securityweek.com,www.rapid7.com,googleprojectzero.blogspot.com,projectzero.google,krebsonsecurity.com,tools.cisco.com,sec.cloudapps.cisco.com,security.paloaltonetworks.com,labs.watchtowr.com,www.talosintelligence.com,blog.talosintelligence.com,www.thezdi.com,www.exploit-db.com,www.debian.org,www.cisecurity.com,cisecurity.com,cisecurity.org,www.cisecurity.org,seclists.org,blog.sucuri.net,www.welivesecurity.com,wordpress.org,www.darkreading.com,blog.google,cloud.google.com,docs.cloud.google.com,workspace.google.com,www.greynoise.io,www.malwarebytes.com,cloudblog.withgoogle.com,www.sophos.com,therecord.media,blog.twitter.com,blog.x.com,github.com,github.blog,www.pentestpartners.com,www.forbes.com,www.theregister.com,api.theregister.com,news.google.com,www.cve.org,cve.org,support.apple.com,helpx.adobe.com,access.redhat.com,security.access.redhat.com,security.redhat.com,usn.ubuntu.com,ubuntu.com,www.crowdstrike.com,crowdstrike.com,securelist.com,www.securelist.com,psirtapi.global.sonicwall.com,psirt.global.sonicwall.com}
      EGRESS_ALLOWED_HOSTS_EXTRA: ${EGRESS_ALLOWED_HOSTS_EXTRA-}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Worker pool: leadership + pipeline lock pin 2 sessions; feed workers
      # get the rest. POOL_API_RESERVED_CONNECTIONS=0 since the worker never
      # serves HTTP.
      POOL_MAX_CONNECTIONS: ${POOL_MAX_CONNECTIONS:-25}
      POOL_RESERVED_CONNECTIONS: ${POOL_RESERVED_CONNECTIONS:-4}
      POOL_API_RESERVED_CONNECTIONS: 0
      FEED_MAX_DURATION_SECONDS: ${FEED_MAX_DURATION_SECONDS:-1800}
      FEED_RETRY_MAX_ATTEMPTS: ${FEED_RETRY_MAX_ATTEMPTS:-3}
      FEED_RETRY_VULNCHECK_MAX_ATTEMPTS: ${FEED_RETRY_MAX_ATTEMPTS:-5}
      FEED_RETRY_BASE_DELAY_MS: ${FEED_RETRY_BASE_DELAY_MS:-2000}
      FEED_RETRY_MAX_DELAY_MS: ${FEED_RETRY_MAX_DELAY_MS:-30000}
      FEED_RETRY_JITTER_FACTOR: ${FEED_RETRY_JITTER_FACTOR:-0.2}
      FEED_CONCURRENCY: ${FEED_CONCURRENCY:-10}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      STUCK_PROMISE_MS: ${STUCK_PROMISE_MS:-300000}
      HANG_DETECTION_ENABLED: 'true'
      CORRELATION_DLQ_DIRECTORY: /var/lib/vulnstream/deadletters
      CORRELATION_DLQ_STORAGE_MODE: database
      ML_DIRECTORY: /var/lib/vulnstream/ml
      ML_STORAGE_MODE: database
    volumes:
      - correlation-deadletters:/var/lib/vulnstream/deadletters
      - ml-models:/var/lib/vulnstream/ml
    deploy:
      replicas: 1
      resources:
        limits:
          # Worker does ingestion, ML training, delivery and all background
          # jobs. 2 CPUs / 2 GiB matches the previous single-instance contract.
          cpus: '2'
          memory: 2G
    command: ["node", "server-dist/main-worker.js"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    networks: [backend, egress]
  proxy:
    image: caddy:2-alpine
    restart: always
    depends_on: [app]
    environment:
      APP_HOST: ${APP_HOST:?Set public hostname}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 80 && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks: [backend, egress]
volumes:
  postgres-data:
  correlation-deadletters:
  ml-models:
  caddy-data:
  caddy-config:
networks:
  backend:
    internal: true
  egress:
